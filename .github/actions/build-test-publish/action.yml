name: Build, test & publish a project image
description: >
  Restores/tests a project, enforces its VERSION bump on PRs, and on push
  to main builds & pushes its image to ECR and tags the commit. Shared by
  the per-project jobs in docker-build-push.yml to avoid repeating the same
  ~10 steps for every project.

inputs:
  project-dir:
    description: Path to the project folder, e.g. src/PTL.Api
    required: true
  test-project:
    description: Path to the project's test .csproj
    required: true
  dockerfile:
    description: Path to the project's Dockerfile
    required: true
  ecr-repository:
    description: ECR repository name, e.g. alpha/ptlapi
    required: true
  image-tag-prefix:
    description: Prefix prepended to the version for the image tag (empty string if none)
    required: false
    default: ""
  git-tag-prefix:
    description: Prefix used for the post-push git tag, e.g. "api" -> api-v<version>
    required: true
  cache-scope:
    description: Unique scope name for the GHA Docker layer cache, e.g. ptl-api
    required: true
  aws-region:
    required: true
  aws-role-arn:
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore & test
      shell: bash
      run: |
        dotnet restore "${{ inputs.test-project }}"
        dotnet test "${{ inputs.test-project }}" -c Release --no-restore

    - name: Verify VERSION was bumped
      if: github.event_name == 'pull_request'
      shell: bash
      run: |
        OLD_VERSION=$(git show "origin/main:${{ inputs.project-dir }}/VERSION" 2>/dev/null || echo "")
        NEW_VERSION=$(cat "${{ inputs.project-dir }}/VERSION")
        if [[ "$OLD_VERSION" == "$NEW_VERSION" ]]; then
          echo "::error::${{ inputs.project-dir }} (or its PTL.ApiClient dependency) changed but VERSION ($NEW_VERSION) wasn't bumped"
          exit 1
        fi

    - name: Read version
      id: ver
      shell: bash
      run: echo "version=$(cat "${{ inputs.project-dir }}/VERSION" | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

    - name: Configure AWS credentials
      if: github.event_name == 'push'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: Login to ECR
      if: github.event_name == 'push'
      id: ecr-login
      uses: aws-actions/amazon-ecr-login@v2

    - uses: docker/setup-buildx-action@v3
      if: github.event_name == 'push'

    - name: Build & push image
      if: github.event_name == 'push'
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        push: true
        tags: ${{ steps.ecr-login.outputs.registry }}/${{ inputs.ecr-repository }}:${{ inputs.image-tag-prefix }}${{ steps.ver.outputs.version }}
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}

    - name: Tag commit with deployed version
      if: github.event_name == 'push'
      shell: bash
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git tag "${{ inputs.git-tag-prefix }}-v${{ steps.ver.outputs.version }}"
        git push origin "${{ inputs.git-tag-prefix }}-v${{ steps.ver.outputs.version }}"
