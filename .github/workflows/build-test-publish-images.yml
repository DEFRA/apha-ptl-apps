name: Build, Test and Publish PT-LIMS Images

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ptlims-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: "783559591987"
  AWS_ROLE_ARN: arn:aws:iam::783559591987:role/github_actions_pipeline_ecr_role
  ECR_REGISTRY: 783559591987.dkr.ecr.eu-west-2.amazonaws.com
  DOTNET_VERSION: "10.0.x"

jobs:
  lint:
    name: Format and build solution
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore PTL.slnx

      - name: Verify formatting
        run: dotnet format PTL.slnx --verify-no-changes --no-restore

      - name: Build solution
        run: |
          dotnet build PTL.slnx \
            --configuration Release \
            --no-restore

  build-test-publish:
    name: Build ${{ matrix.application }}
    needs:
      - lint

    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false

      matrix:
        include:
          - application: PTL API
            project: PTL.Api
            project_file: src/PTL.Api/PTL.Api.csproj
            test_project: tests/PTL.Api.Tests/PTL.Api.Tests.csproj
            dockerfile: src/PTL.Api/Dockerfile
            ecr_repository: apha/ptlapi

          - application: PTL Internal Web
            project: PTL.InternalWeb
            project_file: src/PTL.InternalWeb/PTL.InternalWeb.csproj
            test_project: tests/PTL.InternalWeb.Tests/PTL.InternalWeb.Tests.csproj
            dockerfile: src/PTL.InternalWeb/Dockerfile
            ecr_repository: apha/ptlinternal

          - application: PTL External Web
            project: PTL.ExternalWeb
            project_file: src/PTL.ExternalWeb/PTL.ExternalWeb.csproj
            test_project: tests/PTL.ExternalWeb.Tests/PTL.ExternalWeb.Tests.csproj
            dockerfile: src/PTL.ExternalWeb/Dockerfile
            ecr_repository: apha/ptlexternal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore application
        run: dotnet restore "${{ matrix.project_file }}"

      - name: Build application
        run: |
          dotnet build "${{ matrix.project_file }}" \
            --configuration Release \
            --no-restore

      - name: Test application
        run: |
          dotnet test "${{ matrix.test_project }}" \
            --configuration Release \
            --no-restore \
            --logger "trx;LogFileName=${{ matrix.project }}.trx" \
            --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pull requests build the image but do not access AWS or push to ECR.
      - name: Validate Docker image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.project }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=${{ matrix.project }}
          cache-to: type=gha,mode=max,scope=${{ matrix.project }}

      # This diagnostic step only runs when an ECR publication is required.
      - name: Display OIDC claims for troubleshooting
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE="$(curl --silent --show-error --fail \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"

          TOKEN="$(echo "$RESPONSE" | jq -r '.value')"
          PAYLOAD="$(echo "$TOKEN" | cut -d '.' -f 2)"

          TOKEN_PAYLOAD="$PAYLOAD" python3 - <<'PY'
          import base64
          import json
          import os

          payload = os.environ["TOKEN_PAYLOAD"]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in [
              "aud",
              "sub",
              "repository",
              "repository_owner_id",
              "repository_id",
              "ref",
              "event_name",
              "environment",
          ]:
              print(f"{key}={claims.get(key)}")
          PY

      - name: Configure AWS credentials through GitHub OIDC
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-west-2
          role-to-assume: arn:aws:iam::783559591987:role/github_actions_pipeline_ecr_role
          role-session-name: ptlims-ecr-${{ github.run_id }}-${{ matrix.project }}

      - name: Verify AWS account
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL_ACCOUNT_ID="$(
            aws sts get-caller-identity \
              --query Account \
              --output text
          )"

          echo "Expected account: ${AWS_ACCOUNT_ID}"
          echo "Actual account:   ${ACTUAL_ACCOUNT_ID}"

          if [[ "$ACTUAL_ACCOUNT_ID" != "$AWS_ACCOUNT_ID" ]]; then
            echo "::error::The workflow assumed a role in the wrong AWS account."
            exit 1
          fi

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image metadata
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_TAG="sha-${GITHUB_SHA}"
          IMAGE_URI="${ECR_REGISTRY}/${{ matrix.ecr_repository }}:${IMAGE_TAG}"

          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Build and push image to ECR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.uri }}
          cache-from: type=gha,scope=${{ matrix.project }}
          cache-to: type=gha,mode=max,scope=${{ matrix.project }}
          provenance: true
          sbom: true

      - name: Verify published ECR image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_DIGEST="$(
            aws ecr describe-images \
              --repository-name "${{ matrix.ecr_repository }}" \
              --image-ids imageTag="${{ steps.image.outputs.tag }}" \
              --query "imageDetails[0].imageDigest" \
              --output text
          )"

          if [[ -z "$IMAGE_DIGEST" || "$IMAGE_DIGEST" == "None" ]]; then
            echo "::error::The pushed image could not be found in ECR."
            exit 1
          fi

          echo "digest=${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Publish workflow summary
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          {
            echo "### ${{ matrix.application }} published"
            echo
            echo "- AWS account: \`${AWS_ACCOUNT_ID}\`"
            echo "- AWS region: \`${AWS_REGION}\`"
            echo "- ECR repository: \`${{ matrix.ecr_repository }}\`"
            echo "- Image: \`${{ steps.image.outputs.uri }}\`"
            echo "- Digest: \`${{ steps.verify.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: PT-LIMS CI gate
    needs:
      - lint
      - build-test-publish

    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "::error::Lint job did not succeed."
            exit 1
          fi

          if [[ "${{ needs.build-test-publish.result }}" != "success" ]]; then
            echo "::error::One or more application jobs did not succeed."
            exit 1
          fi